<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #addBtn {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

            #addBtn:hover {
                background-color: #0056b3;
            }

        .intern-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            background-color: #fafafa;
        }

            .intern-card h3 {
                margin: 0 0 5px 0;
            }

            .intern-card p {
                margin: 0 0 10px 0;
                color: #555;
            }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            width: auto;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

            .delete-btn:hover {
                background-color: #c82333;
            }

        .edit-btn {
            background-color: #ffc107;
            color: black;
            border: none;
            width: auto;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }

            .edit-btn:hover {
                background-color: #e0a800;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>Intern Registration</h1>

        <div class="form-container">
            <input type="text" id="nameInput" placeholder="Enter your name">
            <input type="email" id="emailInput" placeholder="Enter your email">
            <button id="addBtn">Start Learning</button>
        </div>

        <div id="internsList"></div>
    </div>

    <!-- JAVASCRIPT IS NOW DIRECTLY INSIDE THE HTML FILE -->
    <script>
        const API_URL = 'http://localhost:3000/interns';
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const addBtn = document.getElementById('addBtn');
        const internsList = document.getElementById('internsList');

        let currentEditId = null;

        async function fetchInterns() {
            try {
                const response = await fetch(API_URL);
                const interns = await response.json();
                internsList.innerHTML = '';

                interns.forEach(intern => {
                    const div = document.createElement('div');
                    div.classList.add('intern-card');
                    div.innerHTML = `
                            <h3>${intern.name}</h3>
                            <p>${intern.email}</p>
                            <button class="edit-btn" onclick="editIntern('${intern._id}', '${intern.name}', '${intern.email}')">Edit</button>
                            <button class="delete-btn" onclick="deleteIntern('${intern._id}')">Delete</button>
                        `;
                    internsList.appendChild(div);
                });
            } catch (error) {
                console.error("Error fetching interns:", error);
            }
        }

        addBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();

            if (!name || !email) {
                alert('Please fill in both fields.');
                return;
            }

            try {
                if (currentEditId) {
                    // PUT (Update)
                    await fetch(`${API_URL}/${currentEditId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, email: email })
                    });
                    currentEditId = null;
                    addBtn.textContent = 'Start Learning';
                    addBtn.style.backgroundColor = '#007BFF';
                    addBtn.style.color = 'white';
                } else {
                    // POST (Create)
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, email: email })
                    });
                }

                nameInput.value = '';
                emailInput.value = '';
                fetchInterns();

            } catch (error) {
                console.error("Error saving intern:", error);
                alert("Could not connect to the server. Is it running?");
            }
        });

        function editIntern(id, name, email) {
            nameInput.value = name;
            emailInput.value = email;
            currentEditId = id;

            addBtn.textContent = 'Update Intern';
            addBtn.style.backgroundColor = '#ffc107';
            addBtn.style.color = 'black';
        }

        async function deleteIntern(id) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchInterns();
            } catch (error) {
                console.error("Error deleting intern:", error);
            }
        }

        fetchInterns();
    </script>
</body>
</html>
